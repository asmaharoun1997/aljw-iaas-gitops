apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["dev.iaas.aljw-cluster.kn8x.net"]                                 # A CONFIRMER (DNS)
      secretName: lms-tls
  rules:
    - host: dev.iaas.aljw-cluster.kn8x.net                                      # A CONFIRMER (DNS)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lms, port: { number: 80 } }
