apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["staging.<domaine>"]                                 # A CONFIRMER (DNS)
      secretName: lms-tls
  rules:
    - host: staging.<domaine>                                      # A CONFIRMER (DNS)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lms, port: { number: 80 } }
