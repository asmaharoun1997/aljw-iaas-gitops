apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/staging
images:
  - name: IMAGE_PLACEHOLDER
    newName: europe-west1-docker.pkg.dev/formation-equipe1/aljw-docker/lms
    newTag: b75b387b
patches:
  - target: { kind: Deployment, name: lms }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { pool: main }

  - target: { kind: Ingress, name: lms }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.aljw-cluster-iaas.kn8x.net
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.aljw-cluster-iaas.kn8x.net
