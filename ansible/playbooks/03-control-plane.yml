---
- name: Initialiser le control plane
  hosts: control_plane
  tasks:
    - name: Générer la configuration kubeadm
      ansible.builtin.template:
        src: ../templates/kubeadm-config.yaml.j2
        dest: /root/kubeadm-config.yaml
        mode: "0600"

    - name: kubeadm init
      ansible.builtin.command: kubeadm init --config /root/kubeadm-config.yaml
      args:
        creates: /etc/kubernetes/admin.conf

    - name: "Récupérer admin.conf en local (droits cluster-admin, jamais dans Git)"
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ lookup('env', 'HOME') }}/.kube/aljw-iaas.yaml"
        flat: true

    - name: "Dossier ~/.kube du poste de contrôle en 0700"
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: "Droits stricts (0600) sur le kubeconfig cluster-admin local"
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/aljw-iaas.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Attendre que l'API réponde
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: readyz
      until: readyz.rc == 0
      retries: 20
      delay: 6
      changed_when: false
