---
# Credential provider kubelet : le kubelet obtient lui-même un jeton Artifact Registry
# depuis le compte de service de la VM (rôle artifactregistry.reader sur aljw-docker).
# À jouer AVANT kubeadm init/join, puis à TESTER sur une VM (voir README).
- name: Installer le credential provider d'images
  hosts: k8s
  tasks:
    - name: Dossier des binaires de credential provider
      ansible.builtin.file:
        path: "{{ credential_provider_bin_dir }}"
        state: directory
        mode: "0755"

    - name: Installer le script gar-credential-provider
      ansible.builtin.copy:
        src: ../files/gar-credential-provider
        dest: "{{ credential_provider_bin_dir }}/gar-credential-provider"
        mode: "0755"

    - name: Configuration du credential provider
      ansible.builtin.template:
        src: ../templates/image-credential-provider.yaml.j2
        dest: "{{ credential_provider_config }}"
        mode: "0644"

    - name: Arguments supplémentaires du kubelet
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        mode: "0644"
        content: |
          KUBELET_EXTRA_ARGS=--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir={{ credential_provider_bin_dir }}
      notify: Redémarrer kubelet

    - name: Test du jeton (métadonnées) depuis la VM
      ansible.builtin.shell: |
        echo '{}' | {{ credential_provider_bin_dir }}/gar-credential-provider | jq -e '.auth | keys[0]'
      register: gar_test
      changed_when: false

    - name: Résultat du test
      ansible.builtin.debug:
        msg: "Le provider répond pour le registre {{ gar_test.stdout }}"

  handlers:
    - name: Redémarrer kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      failed_when: false   # le kubelet redémarre en boucle tant que kubeadm n'a pas tourné
