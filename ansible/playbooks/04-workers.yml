---
- name: Générer la commande de join (sur le master)
  hosts: control_plane
  tasks:
    - name: Créer un jeton de join de 2 h
      ansible.builtin.command: kubeadm token create --ttl 2h --print-join-command
      register: join_cmd
      changed_when: true
      no_log: true

    - name: Mémoriser la commande pour les workers
      ansible.builtin.set_fact:
        worker_join_command: "{{ join_cmd.stdout }}"
      no_log: true

- name: Joindre les workers
  hosts: workers
  tasks:
    - name: kubeadm join
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].worker_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

- name: Étiqueter les nœuds
  hosts: control_plane
  tasks:
    - name: "Chaque worker doit avoir node_pool dans l'inventaire"
      ansible.builtin.assert:
        that: hostvars[item].node_pool is defined
        fail_msg: "node_pool manquant pour {{ item }} : ajouter node_pool=gitlab ou node_pool=main dans inventory.ini"
        quiet: true
      loop: "{{ groups['workers'] }}"

    - name: "Étiqueter chaque worker avec pool=<node_pool de l'inventaire>"
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        label node {{ item }} pool={{ hostvars[item].node_pool }} --overwrite
      loop: "{{ groups['workers'] }}"
      register: label_out
      changed_when: "'not labeled' not in label_out.stdout"
