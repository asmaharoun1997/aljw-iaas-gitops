---
# Test de bout en bout : LB GCP -> Traefik -> HTTP-01 -> certificat Let's Encrypt STAGING.
# Hôte provisoire en nip.io (l'IP du load balancer). Le certificat de staging n'est pas reconnu par les navigateurs.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: cert-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      nodeSelector:
        pool: main
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: cert-test
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: cert-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - whoami.35.205.4.97.nip.io
      secretName: whoami-tls
  rules:
    - host: whoami.35.205.4.97.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
